<nav
  class="navbar navbar-expand-sm myst-navbar fixed-top mb-5"
  aria-label="Primary"
>
  <div class="container">
    <a class="navbar-brand myst-brand" href="{{ '/' | relative_url }}"
      >{{ site.data.profile.navbar_name | replace: '-', '<span class="myst-dash">-</span>' }}</a
    >
    <button
      class="navbar-toggler myst-toggler"
      type="button"
      data-toggle="collapse"
      data-target="#navbarResponsive"
      aria-controls="navbarResponsive"
      aria-expanded="false"
      aria-label="Toggle navigation"
    >
      <span class="myst-toggler-icon" aria-hidden="true"></span>
    </button>

    <div class="collapse navbar-collapse" id="navbarResponsive">
      <ul class="navbar-nav ml-auto">
        {% for item in site.data.navigation.pages %}
        <li
          class="nav-item myst-nav-item {% if item.name == page.navbar_title %}active{% endif %}"
        >
          <a class="nav-link myst-nav-link" href="{{ item.url | relative_url }}"
            >{{ item.name }}</a
          >
        </li>
        {% endfor %}
      </ul>
    </div>
  </div>
</nav>
