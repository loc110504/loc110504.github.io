{% assign news_by_year = site.news | sort: "date" | reverse | slice: 0,
include.limit | group_by_exp: "item", "item.date | date: '%Y'" -%}

<section class="myst-panel myst-news" id="news" data-reveal>
  <h2 class="myst-panel-heading"><i class="fas fa-scroll" aria-hidden="true"></i> News</h2>
  <div class="myst-chronicle">
    {% for year in news_by_year %}
    <div class="myst-chronicle-year">{{ year.name }}</div>
    {% for item in year.items %}
    <div class="myst-chronicle-item">
      <span class="myst-chronicle-seal" aria-hidden="true"></span>
      <span class="myst-chronicle-date">{{ item.date | date: "%b %d" }}</span>
      <span class="myst-chronicle-text">{{ item.title }}</span>
    </div>
    {% endfor %}
    {% endfor %}
  </div>
</section>
