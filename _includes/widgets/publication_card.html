{% assign publications = include.publications %}
<section
  id="selected-publications"
  class="myst-panel myst-selected-pubs"
  data-reveal
  style="scroll-margin-top: 6rem;"
>
  <h2 class="myst-panel-heading">
    {% if include.title %}{{ include.title }}{% else %}<i class="fas fa-star"></i> Selected Publications{% endif %}
  </h2>
  <div class="myst-pub-list">
    {% for item in publications limit:include.limit %}
      {% include widgets/publication_item.html item=item hide_bottom_border=forloop.last %}
    {% endfor %}
  </div>
</section>
